[workspace]
resolver = "2"
members = [
    "shared",
    "player-launcher/src-tauri",
]

[workspace.package]
version = "0.1.4"
edition = "2021"
authors = ["pengport"]
license = "AGPL-3.0-only"
repository = "https://github.com/LostCHoco/PengPort"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
ureq = { version = "3", features = ["rustls", "json"] }
craftping = "0.7"
# Minecraft servers.dat (NBT) 자동 등록용. fastnbt 가 binary NBT 의 표준 라이브러리.
fastnbt = "2"
# Windows 레지스트리 읽기 (Prism InstallLocation 탐색용). 다른 OS 빌드에는 영향 없음.
winreg = "0.55"
# Prism Portable zip 자동 다운로드 + 풀기.
zip = { version = "5", default-features = false, features = ["deflate"] }
