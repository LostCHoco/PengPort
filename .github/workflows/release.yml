name: Release

# Tag push (v0.1.1, v0.2.0 등) 또는 수동 실행 시 PengPort 클라이언트를 빌드하여
# GitHub Release로 배포(포터블 zip + 자동 업데이트용 raw exe/서명/latest.json).
#
# 2026-08 이전엔 오라클 self-hosted endpoint에 SCP 배포했으나, 그 endpoint가
# 인증 없는 공개 경로라 트래픽 폭주(EDoS) 표적이 될 수 있고 Oracle Free Tier는
# 트래픽 초과 시 차단이 아니라 그대로 과금돼서(사용자 확인) GitHub Release로
# 전환 — GitHub은 이런 트래픽에 사실상 무제한이고 과금도 없음.
# `releases/latest/download/<파일명>` 이 태그가 바뀌어도 항상 최신 release를
# 가리키는 고정 주소라 updater가 필요로 하는 "안 바뀌는 폴링 URL" 요건을 만족한다
# (`player-launcher/src-tauri/tauri.conf.json`의 `plugins.updater.endpoints`).
#
# 필요 GH Secrets (Settings → Secrets and variables → Actions):
#   - TAURI_SIGNING_PRIVATE_KEY        : minisign 서명 키 (.secrets/pengport-updater.key 내용)
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD: 서명 키 password (현재 빈 값)
#
# 자세한 셋업 가이드: docs/guide/release-automation.md

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # gh release create/upload
    steps:
      - uses: actions/checkout@v7

      - name: Verify version alignment (tag ≡ tauri.conf.json ≡ Cargo.toml ≡ package.json)
        shell: bash
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # 네 값을 모두 일치시켜야 한다.
          # - tag                : GH Releases / 버전 식별용
          # - tauri.conf.json    : latest.json 의 version (설치 프로그램 없음, 포터블 전용)
          # - Cargo.toml         : binary 의 CARGO_PKG_VERSION (= tauri 의 getVersion() / updater 의
          #                       self-version 비교 기준). 한쪽만 bump 하면 0.1.0 → 0.1.1 update
          #                       후에도 self-version 이 0.1.0 그대로라 무한 update 루프 발생.
          # - package.json       : npm/dev 출력 표시용. PengPort app 자체엔 영향 없지만 일관성 위해
          #                       동기화. mismatch 면 dev 시 "pengport@0.1.0" 같은 stale 출력.
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CONF_VERSION=$(jq -r .version player-launcher/src-tauri/tauri.conf.json)
          CARGO_VERSION=$(awk -F'"' '/^version\s*=/{print $2; exit}' Cargo.toml)
          PKG_VERSION=$(jq -r .version player-launcher/package.json)
          ok=true
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "✗ tauri.conf.json version ($CONF_VERSION) ≠ tag ($TAG_VERSION)"
            ok=false
          fi
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "✗ Cargo.toml workspace.package.version ($CARGO_VERSION) ≠ tag ($TAG_VERSION)"
            ok=false
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "✗ player-launcher/package.json version ($PKG_VERSION) ≠ tag ($TAG_VERSION)"
            ok=false
          fi
          if ! $ok; then
            echo
            echo "→ 세 파일 모두 같은 version 으로 bump 한 commit 후 같은 version 의 tag 를 push 하세요."
            exit 1
          fi
          echo "✓ tag = tauri.conf = Cargo.toml = package.json = $TAG_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Setup Rust
        shell: bash
        run: |
          rustup default stable
          rustup show

      - name: Restore Tauri signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          mkdir -p .secrets
          printf '%s\n' "$KEY" > .secrets/pengport-updater.key

      - name: Build (build_client.py)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: python scripts/build_client.py

      - name: Publish GitHub Release
        # 태그 push일 때만 — workflow_dispatch 수동 실행엔 붙일 태그가 없음. 포터블
        # zip(신규 사용자용 첫 배포 산출물 — 설치 프로그램 없음, build_client.py 모듈
        # docstring 참고) + 자동 업데이트 3종(raw exe/서명/latest.json)을 전부 같은
        # release에 올린다 — latest.json의 url이 이 release의
        # `releases/latest/download/<파일명>`을 가리키므로(build_client.py의
        # UPDATES_BASE_URL) 같은 release에 있어야 함. 포터블 zip은 내부 스테이징
        # 파일명("v3"는 배포 세대 라벨, 앱 버전 아님) 대신 실제 버전으로 복사해서
        # 올린다(`path#label` 문법은 GitHub UI 부가 설명만 바꾸고 실제 다운로드
        # 파일명은 안 바뀜 — 2026-08 v0.2.3에서 실측 확인). 재실행 대비 --clobber.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          ZIP=$(ls client/build/PengPort-*.zip | head -1)
          PORTABLE="client/build/PengPort-${TAG#v}-portable.zip"
          cp "$ZIP" "$PORTABLE"
          ASSETS=("$PORTABLE" client/build/release-*/*)
          gh release create "$TAG" "${ASSETS[@]}" --title "$TAG" --generate-notes \
            || gh release upload "$TAG" "${ASSETS[@]}" --clobber

      - name: Cleanup secrets
        if: always()
        shell: bash
        run: rm -f .secrets/pengport-updater.key
