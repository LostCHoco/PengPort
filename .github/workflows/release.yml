name: Release

# Tag push (v0.1.1, v0.2.0 등) 또는 수동 실행 시 PengPort 클라이언트를 빌드하여
# 인스턴스의 self-hosted updates endpoint 에 SCP 배포.
#
# 펭돌서버 instance 의 oracle Caddy 가 Bearer 토큰 보호된 file_server 로 서빙.
# 다른 instance 운영자가 fork 시 GH Secrets 만 자기 환경에 맞게 채우면 동일하게 작동.
#
# SSH 권한 격리: deploy 는 격리된 SFTP-only user (예: pengport-updater) 만 사용.
#   - oracle 의 그 user 는 `restrict,command="internal-sftp"` 로 shell/임의 명령 차단
#   - file permission 으로 그 user home 만 접근 가능 (ubuntu user 의 secrets 는 격리)
#
# 필요 GH Secrets (Settings → Secrets and variables → Actions):
#   - TAURI_SIGNING_PRIVATE_KEY        : minisign 서명 키 (.secrets/pengport-updater.key 내용)
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD: 서명 키 password (현재 빈 값)
#   - ORACLE_SSH_PRIVATE_KEY           : SFTP 인증용 private key (pengport-updater 의 authorized_keys 와 짝)
#   - ORACLE_KNOWN_HOSTS               : ssh-keyscan 결과 (MITM 방지)
#   - ORACLE_HOST                      : oracle 의 hostname (예: pengdoll.duckdns.org)
#   - ORACLE_USER                      : 격리된 deploy user (예: pengport-updater) — ubuntu 가 아님
#   - ORACLE_PORT                      : oracle 의 SSH port (예: 2222)
#
# 자세한 셋업 가이드: docs/guide/release-automation.md

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # actions/checkout@v4, actions/setup-node@v4, actions/setup-python@v5 들이 내부적으로
    # Node 20 사용 중인데 deprecated (Sep 2026 제거). 새 major 가 나오기 전까지 임시로
    # Node 24 강제 (2026-06-02 부터는 default 가 Node 24 라 이 줄 제거 예정).
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: Verify version alignment (tag ≡ tauri.conf.json ≡ Cargo.toml ≡ package.json)
        shell: bash
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # 네 값을 모두 일치시켜야 한다.
          # - tag                : GH Releases / 버전 식별용
          # - tauri.conf.json    : latest.json 의 version (설치 프로그램 없음, 포터블 전용)
          # - Cargo.toml         : binary 의 CARGO_PKG_VERSION (= tauri 의 getVersion() / updater 의
          #                       self-version 비교 기준). 한쪽만 bump 하면 0.1.0 → 0.1.1 update
          #                       후에도 self-version 이 0.1.0 그대로라 무한 update 루프 발생.
          # - package.json       : npm/dev 출력 표시용. PengPort app 자체엔 영향 없지만 일관성 위해
          #                       동기화. mismatch 면 dev 시 "pengport@0.1.0" 같은 stale 출력.
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CONF_VERSION=$(jq -r .version player-launcher/src-tauri/tauri.conf.json)
          CARGO_VERSION=$(awk -F'"' '/^version\s*=/{print $2; exit}' Cargo.toml)
          PKG_VERSION=$(jq -r .version player-launcher/package.json)
          ok=true
          if [ "$TAG_VERSION" != "$CONF_VERSION" ]; then
            echo "✗ tauri.conf.json version ($CONF_VERSION) ≠ tag ($TAG_VERSION)"
            ok=false
          fi
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "✗ Cargo.toml workspace.package.version ($CARGO_VERSION) ≠ tag ($TAG_VERSION)"
            ok=false
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "✗ player-launcher/package.json version ($PKG_VERSION) ≠ tag ($TAG_VERSION)"
            ok=false
          fi
          if ! $ok; then
            echo
            echo "→ 세 파일 모두 같은 version 으로 bump 한 commit 후 같은 version 의 tag 를 push 하세요."
            exit 1
          fi
          echo "✓ tag = tauri.conf = Cargo.toml = package.json = $TAG_VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Rust
        shell: bash
        run: |
          rustup default stable
          rustup show

      - name: Setup SSH (oracle deploy alias)
        shell: bash
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
          ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
          ORACLE_KNOWN_HOSTS: ${{ secrets.ORACLE_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$ORACLE_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host oracle
            HostName $ORACLE_HOST
            User $ORACLE_USER
            Port $ORACLE_PORT
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config
          # SFTP 연결 테스트 (ForceCommand internal-sftp 환경 호환).
          # 일반 ssh 명령은 차단되므로 sftp client 로 인증/호스트키만 검증.
          echo "exit" | sftp -b - oracle && echo "✓ SFTP 인증 OK"

      - name: Restore Tauri signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          mkdir -p .secrets
          printf '%s\n' "$KEY" > .secrets/pengport-updater.key

      - name: Build and deploy (build_client.py)
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # build_client.py 가 SSH_HOST 가 비어있지 않을 때만 SCP. workflow 에서 활성화.
          PENGPORT_DEPLOY_SSH_HOST: oracle
          PENGPORT_DEPLOY_UPDATES_DIR: "~/updates"
        run: python scripts/build_client.py

      - name: Cleanup secrets
        if: always()
        shell: bash
        run: |
          rm -f .secrets/pengport-updater.key
          rm -f ~/.ssh/deploy_key
          rm -f ~/.ssh/config
