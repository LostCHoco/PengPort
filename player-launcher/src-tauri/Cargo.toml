[package]
name = "pengport"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PengPort - 펭돌서버 통합 런처"

[lib]
# Windows에서 bin과 lib 이름 충돌 방지용 _lib 접미사 (cargo#8519)
name = "pengport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 0.1.3 부터 binary 파일명을 PengPort.exe (대문자) 로. Cargo package name 은
# 소문자 식별자로 그대로 두고 [[bin]] name 만 변경 — Tauri 의 NSIS installer 가
# 이 binary 를 그대로 묶어서 Program Files\PengPort\PengPort.exe 로 설치.
[[bin]]
name = "PengPort"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
# 라이브러리 화면의 "에러 복사" 버튼에 사용. webview 의 navigator.clipboard 는 Tauri 2 에서
# 보안상 차단되는 경우가 있어 native plugin 이 안전.
tauri-plugin-clipboard-manager = "2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }
zip = { workspace = true }
sevenz-rust2 = { workspace = true }
# InstallStep::WriteFile/ThirdPartyAppSetup 의 FileContent::Base64 디코딩.
base64 = { workspace = true }
# 설치/업데이트 idempotent 마커 — 스텝 내용 해시로 "이 스텝이 이미(그리고 지금과
# 동일하게) 적용됐는지" 판단(설치 vs 업데이트를 가르는 핵심).
sha2 = { workspace = true }
# OS native secret store (Windows Credential Manager / macOS Keychain / Linux Secret Service).
# instance_token / updater_token 등 user session 보호 단위로 격리. master password 불필요.
#
# v3 부터 backend feature 를 명시해야 함 — default 는 in-memory mock 이라
# set_password 가 Ok 응답하지만 process 종료 시 휘발 (디버깅 함정).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# 공유 크레이트 (servers.toml 스키마/파서)
pengport-shared = { path = "../../shared" }

# Process tree 조회 — Prism 이 spawn 한 minecraft (java[w].exe) 자식 process 를 감지해서
# ServiceCard 의 "준비 중" → "실행 중" 전환 신호로 사용.
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
# Tauri 내부적으로 tokio 사용하지만 re-export 안 함. polling 의 sleep + async runtime 호환용.
tokio = { version = "1", features = ["time"] }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
# FolderRule 패턴(글롭) 매칭 — pruning 엔진에서 사용.
glob = "0.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 두 번째 launch(`.pengz` 파일 더블클릭 등) 가 별도 process 로 뜨지 않고 첫 번째
# 인스턴스로 args forward 되도록.
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
# minecraft 클라이언트의 visible window 가 떴는지 검출 (EnumWindows + GetWindowThreadProcessId).
# java process spawn ≠ 게임 창 등장 — 그 사이 LWJGL 초기화 + world load 가 있음.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

