[package]
name = "pengport"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "PengPort - 펭돌서버 통합 런처"

[lib]
# Windows에서 bin과 lib 이름 충돌 방지용 _lib 접미사 (cargo#8519)
name = "pengport_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 0.1.3 부터 binary 파일명을 PengPort.exe (대문자) 로. Cargo package name 은
# 소문자 식별자로 그대로 두고 [[bin]] name 만 변경 — Tauri 의 NSIS installer 가
# 이 binary 를 그대로 묶어서 Program Files\PengPort\PengPort.exe 로 설치.
[[bin]]
name = "PengPort"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
# 운영자가 친구에게 보낸 `pengport://join?url=...&token=...` 링크를 클릭하면 PengPort 가
# 받아 인스턴스 등록 dialog 를 띄움. NSIS installer 가 scheme 을 OS 에 자동 등록 안 해서,
# setup() 에서 app.deep_link().register_all() 을 런타임 호출해야 dev/prod 모두 작동.
tauri-plugin-deep-link = "2"
# 운영자가 Settings → 인스턴스 → [초대 링크 복사] 클릭 시 `pengport://join?...` 를 클립보드에
# 쓸 때 사용. webview 의 navigator.clipboard 는 Tauri 2 에서 보안상 차단되는 경우가 있어
# native plugin 이 안전.
tauri-plugin-clipboard-manager = "2"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
ureq = { workspace = true }
zip = { workspace = true }
# OS native secret store (Windows Credential Manager / macOS Keychain / Linux Secret Service).
# instance_token / updater_token 등 user session 보호 단위로 격리. master password 불필요.
#
# v3 부터 backend feature 를 명시해야 함 — default 는 in-memory mock 이라
# set_password 가 Ok 응답하지만 process 종료 시 휘발 (디버깅 함정).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# 공유 크레이트 (servers.toml 스키마/파서)
pengport-shared = { path = "../../shared" }

# Process tree 조회 — Prism 이 spawn 한 minecraft (java[w].exe) 자식 process 를 감지해서
# ServiceCard 의 "준비 중" → "실행 중" 전환 신호로 사용.
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
# Tauri 내부적으로 tokio 사용하지만 re-export 안 함. polling 의 sleep + async runtime 호환용.
tokio = { version = "1", features = ["time"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# 두 번째 launch (deep link 클릭 등) 가 별도 process 로 뜨지 않고 첫 번째 인스턴스로 args
# forward 되도록. deep_link plugin v2 가 desktop 에서 single_instance 와 함께 쓰는 걸 권장 —
# OS 가 새 process 를 spawn 하면서 URL 을 argv 로 넘기므로 첫 인스턴스가 그걸 emit 으로 받아야.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
# minecraft 클라이언트의 visible window 가 떴는지 검출 (EnumWindows + GetWindowThreadProcessId).
# java process spawn ≠ 게임 창 등장 — 그 사이 LWJGL 초기화 + world load 가 있음.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

